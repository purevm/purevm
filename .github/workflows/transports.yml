name: Transports

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/transports.yml"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "package.json"
      - "packages/transports/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - ".github/workflows/transports.yml"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "package.json"
      - "packages/transports/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read

concurrency:
  group: transports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate transports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @purevm/transports validate
