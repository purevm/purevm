name: Transports

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/transports.yml"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "package.json"
      - "packages/transports/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - ".github/workflows/transports.yml"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "package.json"
      - "packages/transports/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

concurrency:
  group: transports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate transports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @purevm/transports validate
