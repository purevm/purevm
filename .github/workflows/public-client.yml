name: Public client

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-client.yml"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "package.json"
      - "packages/public-client/**"
      - "packages/rpc-transport/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - ".github/workflows/public-client.yml"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "package.json"
      - "packages/public-client/**"
      - "packages/rpc-transport/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read

concurrency:
  group: public-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @purevm/rpc-transport build

      - run: pnpm --filter @purevm/public-client validate
