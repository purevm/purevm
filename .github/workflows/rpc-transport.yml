name: RPC transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rpc-transport.yml"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "package.json"
      - "packages/rpc-transport/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - ".github/workflows/rpc-transport.yml"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "package.json"
      - "packages/rpc-transport/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read

concurrency:
  group: rpc-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate rpc-transport
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @purevm/rpc-transport validate
