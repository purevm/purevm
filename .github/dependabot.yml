version: 2
updates:
  # Keeps the SHA-pinned actions current. The prefix makes messages like
  # `ci(deps): bump actions/checkout from 5.1.0 to 5.2.0`, which pass commitlint.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
